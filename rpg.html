<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .password-box {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
        }

        #password {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .copy-btn {
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .copy-btn:hover {
            background: #5568d8;
        }

        .option {
            margin: 15px 0;
        }

        .length-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 10px;
        }

        label {
            color: #333;
            cursor: pointer;
        }

        input[type="checkbox"] {
            margin-right: 8px;
        }

        .generate-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #764ba2;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #623d88;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: #28a745;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Password Generator</h1>

        <div class="password-box">
            <input type="text" id="password" placeholder="Your password" readonly>
            <button class="copy-btn" onclick="copyPassword()">Copy</button>
        </div>

        <div class="option">
            <div class="length-row">
                <label>Password Length</label>
                <strong id="lengthValue">12</strong>
            </div>

            <input
                type="range"
                id="length"
                min="4"
                max="30"
                value="12"
                oninput="updateLength()"
            >
        </div>

        <div class="option">
            <label>
                <input type="checkbox" id="uppercase" checked>
                Uppercase Letters (A-Z)
            </label>
        </div>

        <div class="option">
            <label>
                <input type="checkbox" id="lowercase" checked>
                Lowercase Letters (a-z)
            </label>
        </div>

        <div class="option">
            <label>
                <input type="checkbox" id="numbers" checked>
                Numbers (0-9)
            </label>
        </div>

        <div class="option">
            <label>
                <input type="checkbox" id="symbols" checked>
                Symbols (!@#$%)
            </label>
        </div>

        <button class="generate-btn" onclick="generatePassword()">
            Generate Password
        </button>

        <div id="message"></div>

    </div>

    <script>

        const uppercaseChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowercaseChars = "abcdefghijklmnopqrstuvwxyz";
        const numberChars = "0123456789";
        const symbolChars = "!@#$%^&*()_+-=[]{}|;:,.<>?";

        function updateLength() {
            const length = document.getElementById("length").value;
            document.getElementById("lengthValue").textContent = length;
        }

        function generatePassword() {

            const length = parseInt(
                document.getElementById("length").value
            );

            const useUppercase =
                document.getElementById("uppercase").checked;

            const useLowercase =
                document.getElementById("lowercase").checked;

            const useNumbers =
                document.getElementById("numbers").checked;

            const useSymbols =
                document.getElementById("symbols").checked;

            let characters = "";

            if (useUppercase) {
                characters += uppercaseChars;
            }

            if (useLowercase) {
                characters += lowercaseChars;
            }

            if (useNumbers) {
                characters += numberChars;
            }

            if (useSymbols) {
                characters += symbolChars;
            }

            if (characters.length === 0) {
                alert("Please select at least one character type.");
                return;
            }

            let password = "";

            for (let i = 0; i < length; i++) {
                const randomIndex =
                    Math.floor(Math.random() * characters.length);

                password += characters[randomIndex];
            }

            document.getElementById("password").value = password;

            document.getElementById("message").textContent =
                "Password generated successfully!";
        }

        function copyPassword() {

            const password =
                document.getElementById("password").value;

            if (password === "") {
                alert("Generate a password first!");
                return;
            }

            navigator.clipboard.writeText(password);

            document.getElementById("message").textContent =
                "Password copied! ✓";
        }

        // Generate a password when the page loads
        generatePassword();

    </script>

</body>
</html>
