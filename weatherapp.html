<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="weather-container">

        <h1>🌤️ Weather App</h1>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>

        </div>

        <div id="loading">
            Loading...
        </div>

        <div id="error"></div>

        <div class="weather-result">

            <h2 id="cityName">
                Search for a city
            </h2>

            <div id="weatherIcon">
                🌤️
            </div>

            <div id="temperature">
                --°C
            </div>

            <p id="description">
                Weather information
            </p>

            <div class="details">

                <div class="detail-box">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail-box">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">-- km/h</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
