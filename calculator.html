<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .calculator {
            width: 350px;
            padding: 25px;
            border-radius: 25px;
            background: #1e1e2f;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .title {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 24px;
        }

        #display {
            width: 100%;
            height: 80px;
            border: none;
            outline: none;
            border-radius: 15px;
            margin-bottom: 20px;
            padding: 15px;
            font-size: 35px;
            text-align: right;
            background: #10101c;
            color: white;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: #303044;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: #41415a;
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #ffad32;
        }

        .clear {
            background: #e74c3c;
        }

        .clear:hover {
            background: #ff5c4d;
        }

        .equal {
            background: #27ae60;
        }

        .equal:hover {
            background: #35c875;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="title">DASAN's Calculator</div>

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteNumber()">⌫</button>
            <button onclick="add('%')">%</button>
            <button class="operator" onclick="add('/')">÷</button>

            <button onclick="add('7')">7</button>
            <button onclick="add('8')">8</button>
            <button onclick="add('9')">9</button>
            <button class="operator" onclick="add('*')">×</button>

            <button onclick="add('4')">4</button>
            <button onclick="add('5')">5</button>
            <button onclick="add('6')">6</button>
            <button class="operator" onclick="add('-')">−</button>

            <button onclick="add('1')">1</button>
            <button onclick="add('2')">2</button>
            <button onclick="add('3')">3</button>
            <button class="operator" onclick="add('+')">+</button>

            <button class="zero" onclick="add('0')">0</button>
            <button onclick="add('.')">.</button>
            <button class="equal" onclick="result()">=</button>

        </div>
    </div>

    <script>

        let display = document.getElementById("display");

        function add(value) {

            if (display.value === "0") {
                display.value = value;
            } 
            else {
                display.value += value;
            }
        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteNumber() {

            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } 
            else {
                display.value = "0";
            }
        }

        function result() {

            try {

                let expression = display.value;

                expression = expression.replace(
                    /(\d+(\.\d+)?)%/g,
                    "($1/100)"
                );

                display.value = eval(expression);

            } 
            catch {

                display.value = "Error";

            }
        }

    </script>

</body>
</html>
