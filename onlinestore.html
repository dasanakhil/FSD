<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple E-Commerce Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        /* Navbar */
        nav {
            background: #222;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 25px;
        }

        .cart {
            font-size: 18px;
            cursor: pointer;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 50px 20px;
            background: #ddd;
        }

        .hero h2 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
        }

        /* Search */
        .search-box {
            text-align: center;
            margin: 25px;
        }

        .search-box input {
            width: 80%;
            max-width: 500px;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        /* Products */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            padding: 20px 7%;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .product .image {
            font-size: 80px;
            margin-bottom: 15px;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .product button:hover {
            background: #444;
        }

        /* Cart */
        .cart-section {
            background: white;
            margin: 30px 7%;
            padding: 25px;
            border-radius: 10px;
        }

        .cart-section h2 {
            margin-bottom: 20px;
        }

        #cartItems {
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .quantity button {
            padding: 3px 8px;
            margin: 0 5px;
            cursor: pointer;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
        }

        .checkout {
            margin-top: 15px;
            padding: 12px 20px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <h1>🛍️ Dasan's Store</h1>

        <div class="cart">
            🛒 Cart: <span id="cartCount">0</span>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h2>Welcome to My Store</h2>
        <p>Find the best products at affordable prices!</p>
    </section>

    <!-- Search -->
    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            onkeyup="searchProducts()"
        >
    </div>

    <!-- Products -->
    <section class="products" id="productList">

        <div class="product" data-name="T-Shirt">
            <div class="image">👕</div>
            <h3>T-Shirt</h3>
            <div class="price">₹499</div>

            <button onclick="addToCart('T-Shirt', 499)">
                Add to Cart
            </button>
        </div>

        <div class="product" data-name="Shoes">
            <div class="image">👟</div>
            <h3>Shoes</h3>
            <div class="price">₹999</div>

            <button onclick="addToCart('Shoes', 999)">
                Add to Cart
            </button>
        </div>

        <div class="product" data-name="Watch">
            <div class="image">⌚</div>
            <h3>Watch</h3>
            <div class="price">₹799</div>

            <button onclick="addToCart('Watch', 799)">
                Add to Cart
            </button>
        </div>

        <div class="product" data-name="Backpack">
            <div class="image">🎒</div>
            <h3>Backpack</h3>
            <div class="price">₹699</div>

            <button onclick="addToCart('Backpack', 699)">
                Add to Cart
            </button>
        </div>

    </section>

    <!-- Cart -->
    <section class="cart-section">

        <h2>🛒 Shopping Cart</h2>

        <div id="cartItems">
            Your cart is empty.
        </div>

        <div class="total">
            Total: ₹<span id="totalPrice">0</span>
        </div>

        <button class="checkout" onclick="checkout()">
            Checkout
        </button>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Store | E-Commerce Website</p>
    </footer>


    <script>

        let cart = [];

        // Add product to cart
        function addToCart(name, price) {

            let existingProduct = cart.find(
                product => product.name === name
            );

            if (existingProduct) {
                existingProduct.quantity++;
            } else {
                cart.push({
                    name: name,
                    price: price,
                    quantity: 1
                });
            }

            displayCart();
        }


        // Display cart
        function displayCart() {

            let cartItems = document.getElementById("cartItems");

            cartItems.innerHTML = "";

            if (cart.length === 0) {

                cartItems.innerHTML = "Your cart is empty.";

            } else {

                cart.forEach((product, index) => {

                    let item = document.createElement("div");

                    item.className = "cart-item";

                    item.innerHTML = `
                        <span>
                            ${product.name} - ₹${product.price}
                        </span>

                        <span class="quantity">

                            <button onclick="decreaseQuantity(${index})">
                                -
                            </button>

                            ${product.quantity}

                            <button onclick="increaseQuantity(${index})">
                                +
                            </button>

                            <button onclick="removeItem(${index})">
                                ❌
                            </button>

                        </span>
                    `;

                    cartItems.appendChild(item);

                });
            }

            updateTotal();
        }


        // Increase quantity
        function increaseQuantity(index) {

            cart[index].quantity++;

            displayCart();
        }


        // Decrease quantity
        function decreaseQuantity(index) {

            cart[index].quantity--;

            if (cart[index].quantity <= 0) {

                cart.splice(index, 1);

            }

            displayCart();
        }


        // Remove product
        function removeItem(index) {

            cart.splice(index, 1);

            displayCart();
        }


        // Calculate total
        function updateTotal() {

            let total = 0;
            let count = 0;

            cart.forEach(product => {

                total += product.price * product.quantity;

                count += product.quantity;

            });

            document.getElementById("totalPrice").innerText = total;

            document.getElementById("cartCount").innerText = count;
        }


        // Search products
        function searchProducts() {

            let searchText =
                document.getElementById("searchInput")
                .value
                .toLowerCase();

            let products =
                document.querySelectorAll(".product");

            products.forEach(product => {

                let name =
                    product.dataset.name.toLowerCase();

                if (name.includes(searchText)) {

                    product.style.display = "block";

                } else {

                    product.style.display = "none";

                }

            });
        }


        // Checkout
        function checkout() {

            if (cart.length === 0) {

                alert("Your cart is empty!");

            } else {

                alert(
                    "Order placed successfully! 🎉\nThank you for shopping."
                );

                cart = [];

                displayCart();
            }
        }

    </script>

</body>
</html>
